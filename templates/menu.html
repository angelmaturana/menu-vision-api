<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cervecería Sin Abril | Carta</title>
    <style>
        :root { color-scheme: dark; --charcoal: #121212; --white: #fff; --gold: #fdb813; --red: #dc2626; --muted: #b7b7b7; --panel: #1d1d1d; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Georgia, "Times New Roman", serif;
            background: var(--charcoal);
            color: var(--white);
            line-height: 1.5;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 920px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid #383838;
            border-top: 4px solid var(--red);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
            overflow: hidden;
        }
        .brand { display: flex; align-items: center; gap: 18px; padding: 24px 28px 18px; border-bottom: 1px solid #383838; }
        .logo { width: 74px; height: 74px; object-fit: contain; border-radius: 50%; background: var(--white); }
        h1 { font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1; letter-spacing: .02em; }
        .eyebrow { margin-top: 8px; color: var(--gold); font: 700 .75rem/1.2 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
        .intro { padding: 18px 28px; color: var(--muted); font-size: 1rem; }
        .image-wrapper {
            position: relative;
            width: 100%;
            background: #090909;
            border-top: 1px solid #383838;
            border-bottom: 1px solid #383838;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .image-wrapper img {
            max-width: 100%;
            max-height: 78vh;
            display: block;
            border-radius: 2px;
            box-shadow: 0 8px 30px rgba(0,0,0,.45);
            object-fit: contain;
        }
        .controls {
            padding: 20px 28px;
            background: #181818;
            display: flex;
            justify-content: center;
        }
        button { padding: 13px 26px; border: 0; border-radius: 2px; cursor: pointer; font: 700 .95rem Arial, sans-serif; transition: background-color .2s, transform .2s; }
        button:hover { transform: translateY(-1px); }
        .btn-download { background: var(--gold); color: #121212; }
        .btn-download:hover, .btn-download:focus-visible { background: var(--red); color: var(--white); }
        button:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
        .info { padding: 15px 28px 22px; text-align: center; color: var(--muted); font: .85rem Arial, sans-serif; }
        .info strong { color: var(--gold); }
        @media (max-width: 600px) {
            body { padding: 0; }
            .brand { padding: 20px 18px 16px; }
            .logo { width: 60px; height: 60px; }
            .intro, .controls, .info { padding-left: 18px; padding-right: 18px; }
            .image-wrapper { padding: 8px; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="brand">
            <img class="logo" src="data:image/jpeg;base64,{{ logo_base64 }}" alt="Logo Cervecería Sin Abril">
            <div>
                <h1>Cervecería Sin Abril</h1>
                <p class="eyebrow">Valdemoro · Carta oficial</p>
            </div>
        </header>
        <p class="intro">Bienvenido. Consulta nuestra carta y descubre tus próximos favoritos.</p>

        <div class="image-wrapper">
            <img class="embedded-image" alt="Menu Card"
                 src="data:image/{{ image_format | default('jpeg') }};base64,{{ image_base64 }}">
        </div>

        <div class="controls">
            <button class="btn-download" type="button" onclick="downloadImage()">Descargar carta</button>
        </div>

        <div class="info">
            <p>{{ image_title | default('Carta de la cervecería') }}</p>
        </div>
    </div>

    <script>
        async function downloadImage() {
            try {
                const imageSource = document.querySelector('.embedded-image').src;
                const [metadata, base64Data] = imageSource.split(',', 2);
                const typeMatch = metadata.match(/data:image\/([^;]+);base64/);
                if (!base64Data || !typeMatch) throw new Error('Image data not found');
                const mimeType = `image/${typeMatch[1]}`;

                const byteChars = atob(base64Data);
                const byteNumbers = new Array(byteChars.length);
                for (let i = 0; i < byteChars.length; i++) {
                    byteNumbers[i] = byteChars.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: mimeType });

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `carta-cerveceria-sin-abril.${typeMatch[1] || 'jpg'}`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                alert('Download failed: ' + error.message);
            }
        }
    </script>
</body>
</html>
