<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar carta | Cervecería Sin Abril</title>
    <style>
        :root { color-scheme: dark; --charcoal: #121212; --white: #fff; --gold: #fdb813; --red: #dc2626; --muted: #b7b7b7; --panel: #1d1d1d; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--white);
            background: var(--charcoal);
        }
        .panel {
            width: min(100%, 560px);
            padding: 30px;
            background: var(--panel);
            border: 1px solid #383838;
            border-top: 4px solid var(--red);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
        }
        .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
        .logo { width: 124px; height: auto; max-width: 34vw; display: block; }
        h1 { margin: 0 0 7px; font-size: clamp(1.7rem, 5vw, 2.35rem); line-height: 1.05; }
        .eyebrow { margin: 0; color: var(--gold); font: 700 .72rem/1.2 Arial, sans-serif; letter-spacing: .13em; text-transform: uppercase; }
        .description { margin: 0 0 28px; color: var(--muted); }
        .file-field {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1px solid #555;
            border-radius: 2px;
            background: #111;
            color: var(--white);
        }
        .default-option {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin: 20px 0;
            line-height: 1.4;
            color: var(--muted);
        }
        .default-option input { margin-top: 4px; }
        button {
            width: 100%;
            padding: 13px 20px;
            border: 0;
            border-radius: 2px;
            background: var(--gold);
            color: var(--charcoal);
            cursor: pointer;
            font: 700 1rem Arial, sans-serif;
        }
        button:hover, button:focus-visible { background: var(--red); color: var(--white); }
        button:disabled { cursor: wait; opacity: 0.65; }
        button:focus-visible, .back:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
        .status { min-height: 24px; margin: 16px 0 0; color: var(--muted); font-family: Arial, sans-serif; }
        .status.error { color: #ff7777; }
        .back { display: inline-block; margin-top: 20px; color: var(--gold); font-family: Arial, sans-serif; }
        @media (max-width: 600px) { body { padding: 0; } .panel { min-height: 100vh; border-left: 0; border-right: 0; } }
        .watermark { position: fixed; z-index: 9999; top: 50%; left: 50%; width: 170vw; padding: 18px 0; transform: translate(-50%, -50%) rotate(-25deg); background: rgba(220, 38, 38, .2); color: rgba(255, 255, 255, .86); font: 900 clamp(3rem, 12vw, 9rem)/1 Arial, sans-serif; letter-spacing: .16em; text-align: center; text-transform: uppercase; pointer-events: none; user-select: none; white-space: nowrap; border-top: 4px solid rgba(220, 38, 38, .65); border-bottom: 4px solid rgba(220, 38, 38, .65); }
    </style>
</head>
<body>
    <div class="watermark" aria-hidden="true">Provisional</div>
    <main class="panel">
        <header class="brand">
            <img class="logo" src="data:image/jpeg;base64,{{ logo_base64 }}" alt="Logo Cervecería Sin Abril">
            <div><h1>Subir nueva carta</h1><p class="eyebrow">Cervecería Sin Abril</p></div>
        </header>
        <p class="description">Selecciona la imagen que quieres mostrar en la carta pública.</p>

        <form id="upload-form">
            <input class="file-field" id="image-file" type="file" accept="image/*" required>
            <label class="default-option">
                <input id="use-default" type="checkbox" checked>
                <span>Guardar como imagen por defecto (ID: <strong>{{ default_image_id }}</strong>)</span>
            </label>
            <button id="submit-button" type="submit">Subir imagen</button>
            <p id="status" class="status" role="status"></p>
        </form>

        <a class="back" href="/menu/default">Volver a la carta</a>
    </main>

    <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('image-file');
        const useDefault = document.getElementById('use-default');
        const submitButton = document.getElementById('submit-button');
        const status = document.getElementById('status');

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            submitButton.disabled = true;
            status.className = 'status';
            status.textContent = 'Subiendo imagen...';

            const reader = new FileReader();
            reader.onload = async () => {
                try {
                    const response = await fetch('/api/v1/parse-menu', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image_b64: reader.result,
                            use_default: useDefault.checked
                        })
                    });
                    const data = await response.json();
                    if (!response.ok || data.status !== 'success') {
                        throw new Error(data.detail || 'No se pudo subir la imagen');
                    }
                    window.location.href = data.view_url;
                } catch (error) {
                    status.className = 'status error';
                    status.textContent = error.message;
                    submitButton.disabled = false;
                }
            };
            reader.onerror = () => {
                status.className = 'status error';
                status.textContent = 'No se pudo leer el archivo';
                submitButton.disabled = false;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
