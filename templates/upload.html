<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir carta - Bar Sinabril</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #243447;
            background: #f5f7fa;
        }
        .panel {
            width: min(100%, 560px);
            padding: 32px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }
        h1 { margin: 0 0 8px; }
        .description { margin: 0 0 28px; color: #667085; }
        .file-field {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            background: #fff;
        }
        .default-option {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin: 20px 0;
            line-height: 1.4;
        }
        .default-option input { margin-top: 4px; }
        button {
            width: 100%;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #3498db;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
        }
        button:disabled { cursor: wait; opacity: 0.65; }
        .status { min-height: 24px; margin: 16px 0 0; color: #667085; }
        .status.error { color: #b42318; }
        .back { display: inline-block; margin-top: 20px; color: #2878b5; }
    </style>
</head>
<body>
    <main class="panel">
        <h1>Subir nueva carta</h1>
        <p class="description">Selecciona la imagen que quieres mostrar en el menú.</p>

        <form id="upload-form">
            <input class="file-field" id="image-file" type="file" accept="image/*" required>
            <label class="default-option">
                <input id="use-default" type="checkbox" checked>
                <span>Guardar como imagen por defecto (ID: <strong>{{ default_image_id }}</strong>)</span>
            </label>
            <button id="submit-button" type="submit">Subir imagen</button>
            <p id="status" class="status" role="status"></p>
        </form>

        <a class="back" href="/menu/default">Volver a la carta</a>
    </main>

    <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('image-file');
        const useDefault = document.getElementById('use-default');
        const submitButton = document.getElementById('submit-button');
        const status = document.getElementById('status');

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            submitButton.disabled = true;
            status.className = 'status';
            status.textContent = 'Subiendo imagen...';

            const reader = new FileReader();
            reader.onload = async () => {
                try {
                    const response = await fetch('/api/v1/parse-menu', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image_b64: reader.result,
                            use_default: useDefault.checked
                        })
                    });
                    const data = await response.json();
                    if (!response.ok || data.status !== 'success') {
                        throw new Error(data.detail || 'No se pudo subir la imagen');
                    }
                    window.location.href = data.view_url;
                } catch (error) {
                    status.className = 'status error';
                    status.textContent = error.message;
                    submitButton.disabled = false;
                }
            };
            reader.onerror = () => {
                status.className = 'status error';
                status.textContent = 'No se pudo leer el archivo';
                submitButton.disabled = false;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
